name: Auto-bump Casks

on:
  schedule:
    # Esecuzione automatica ogni notte alle 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla UI di GitHub

jobs:
  autobump:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Bump Casks with Livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scansiona e aggiorna i cask del tap se livecheck rileva una nuova versione
          brew bump --tap=lubomben/homebrew-tap --write-only || true

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add Casks/
            git commit -m "chore(casks): automated version bump"
            git push origin main
          else
            echo "Nessun aggiornamento disponibile."
          fi
