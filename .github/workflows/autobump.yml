name: Auto-bump Casks

on:
  schedule:
    # Esecuzione programmata ogni notte alle 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Avvio manuale da GitHub Actions

jobs:
  autobump:
    runs-on: macos-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Bump Casks with Livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for cask_file in Casks/*.rb; do
            cask_name=$(basename "$cask_file" .rb)
            echo "::group::Controllo $cask_name"

            json_data=$(brew livecheck --cask --json "lubomben/tap/$cask_name" 2>/dev/null || true)
            latest_ver=$(echo "$json_data" | jq -r '.[0].version.latest // empty' 2>/dev/null || true)
            current_ver=$(echo "$json_data" | jq -r '.[0].version.current // empty' 2>/dev/null || true)
            is_outdated=$(echo "$json_data" | jq -r '.[0].version.outdated // false' 2>/dev/null || true)

            echo "Cask: $cask_name | Attuale: $current_ver | Upstream: $latest_ver"

            if [ "$is_outdated" = "true" ] && [ -n "$latest_ver" ] && [ "$latest_ver" != "null" ]; then
              echo "-> Nuova versione disponibile ($latest_ver). Eseguo bump..."
              brew bump-cask-pr --write-only --version="$latest_ver" "lubomben/tap/$cask_name" || true
            else
              echo "-> Nessun aggiornamento necessario (già allineato)."
            fi

            echo "::endgroup::"
          done

      - name: Commit, Push and Notify
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            BUMPED=$(git status --porcelain Casks/ | awk '{print $2}' | xargs -n1 basename .rb | paste -sd ", " -)
            echo "Cask aggiornati: $BUMPED"

            git add Casks/
            git commit -m "chore(casks): automated version bump [$BUMPED]"
            git push origin main

            # Notifica push solo se i secret sono valorizzati
            if [[ -n "$PUSHOVER_TOKEN" && -n "$PUSHOVER_USER" ]]; then
              curl -s \
                --form-string "token=$PUSHOVER_TOKEN" \
                --form-string "user=$PUSHOVER_USER" \
                --form-string "title=Homebrew Tap: Update Rilevato" \
                --form-string "message=Nuova versione disponibile e recepita nel tap per: $BUMPED" \
                https://api.pushover.net/1/messages.json > /dev/null
            fi
          else
            echo "Nessun aggiornamento disponibile: tutti i Cask sono allineati."
          fi
