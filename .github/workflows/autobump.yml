name: Auto-bump Casks

on:
  schedule:
    # Esecuzione programmata ogni notte alle 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Permette l'avvio manuale da GitHub Actions

jobs:
  autobump:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Bump Casks with Livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for cask_file in Casks/*.rb; do
            cask_name=$(basename "$cask_file" .rb)
            echo "::group::Controllo $cask_name"
            brew bump-cask-pr --write-only "lubomben/tap/$cask_name" || true
            echo "::endgroup::"
          done

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add Casks/
            git commit -m "chore(casks): automated version bump"
            git push origin main
          else
            echo "Nessun aggiornamento disponibile: tutti i Cask sono allineati."
          fi
